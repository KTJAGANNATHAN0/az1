    viewBox="0 0 313 597"
    fill="none">

  <defs>

    <linearGradient id="bg" x1="156.5" y1="0" x2="156.5" y2="597" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070808"/>
      <stop offset="55%" stop-color="#0C0E0D"/>
      <stop offset="100%" stop-color="#1D4437"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="313" y2="597">
      <stop offset="0%" stop-color="#82FFD7"/>
      <stop offset="100%" stop-color="#49D6A2"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01"/>
    </linearGradient>

    <radialGradient id="bottomGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#63F3C0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#63F3C0" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="313" height="597" fill="url(#bg)"/>

  <!-- Bottom glow -->
  <ellipse
      cx="156.5"
      cy="560"
